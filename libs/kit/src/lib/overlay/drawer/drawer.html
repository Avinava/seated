@if (open()) {
  <div class="scrim" aria-hidden="true" animate.enter="scrim-in" animate.leave="scrim-out"></div>
  <section
    class="panel"
    role="dialog"
    tabindex="-1"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
    [attr.aria-describedby]="description() ? descriptionId : null"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    animate.enter="panel-in"
    animate.leave="panel-out"
    (keydown.escape)="onEscape($event)"
  >
    <header class="header">
      <div class="heading">
        <h2 class="title" [id]="titleId">{{ heading() }}</h2>
        @if (description()) {
          <p class="description" [id]="descriptionId">{{ description() }}</p>
        }
      </div>
      <ng-content select="[stDrawerActions]" />
      <button type="button" class="close" [attr.aria-label]="closeLabel()" (click)="close()">
        <st-icon name="x" [size]="18" />
      </button>
    </header>
    <div class="body">
      <ng-content />
    </div>
    <footer class="footer"><ng-content select="[stDrawerFooter]" /></footer>
  </section>
}
