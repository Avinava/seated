name: Gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      # The kit visual tests run in the `visual` job, inside the pinned Playwright image.
      SKIP_VISUAL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: sudo apt-get install -y ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: mise run gate
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gate-results
          path: |
            test-results
            playwright-report
            .lighthouseci
          if-no-files-found: ignore

  visual:
    runs-on: ubuntu-24.04
    # Keep in step with @playwright/test in package.json; tools/visual.sh derives the same tag.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable && corepack prepare pnpm@10.34.6 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec ng run kit:build-storybook --quiet
      - run: tools/visual.sh
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-results
          path: |
            test-results-visual
            playwright-report/visual
          if-no-files-found: ignore
